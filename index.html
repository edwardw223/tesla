<!DOCTYPE html>
<html lang="zh">
<head>
<script>
    if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        window.location.href = "mobile.html";
    }
    </script>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla WebHub</title>
<style>
  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
  }
  #adBanner {
    width: 1080px;
    max-width: 95%;
    height: 180px;
    background: transparent;
    border: none;   
    border-radius: 12px;
    margin-bottom: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .nav-links {
  display: flex;
  flex-wrap: wrap;            /* ✅ 超出宽度自动换行 */
  justify-content: center;    /* ✅ 居中排列 */
  align-items: center;
  gap: 18px 26px;             /* ✅ 按钮间距 */
  max-width: 1080px;          /* ✅ 与广告图对齐 */
  margin: 0 auto 50px auto;   /* ✅ 居中 + 底部留白 */
  padding: 0 10px;
  box-sizing: border-box;
  }
  .nav-links a, .add-btn {
    padding: 12px 26px;
    background: rgba(0, 191, 255, 0.15);
    border: 1px solid #00bfff;
    border-radius: 50px;
    color: #00bfff;
    text-decoration: none;
    transition: 0.3s;
    cursor: pointer;
    font-size: 1.1rem;
  }
  .nav-links a:hover, .add-btn:hover {
    background: #00bfff;
    color: #000;
    box-shadow: 0 0 15px #00bfff;
  }
  /* ✅ 站点分类标题（占满一行，自动换行分组） */
  .nav-group {
    flex: 0 0 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 6px 0 -4px 0;
    color: #5fd8ff;
    font-size: 0.95rem;
    letter-spacing: 3px;
    text-shadow: 0 0 8px rgba(0, 191, 255, 0.6);
  }
  /* ✅ 换行占位：让管理按钮单独一行 */
  .nav-break {
    flex: 0 0 100%;
    height: 0;
  }
  .nav-group::before,
  .nav-group::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(0, 191, 255, 0),
      rgba(0, 191, 255, 0.55),
      rgba(0, 191, 255, 0));
  }
  .url-box {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  #urlInput {
    width: 600px;
    padding: 15px;
    border-radius: 30px 0 0 30px;
    border: 1px solid #00bfff;
    outline: none;
    background: #111;
    color: #fff;
    font-size: 1rem;
  }
  #goButton {
    padding: 15px 28px;
    border-radius: 0 30px 30px 0;
    border: 1px solid #00bfff;
    background: #00bfff;
    color: #000;
    cursor: pointer;
    font-size: 1rem;
  }
  /* ✅ 全屏入口：站点主按钮，默认就是高亮态（触摸屏没有 hover，不做悬停样式） */
  #fullscreenLink {
    margin-top: 0;
    padding: 14px 40px;
    display: inline-block;
    font-size: 2.6rem;
    font-weight: bold;
    color: #ffd75e;
    background: radial-gradient(circle at 50% 50%, rgba(255, 183, 0, 0.22), rgba(255, 140, 0, 0.06) 70%, rgba(0, 0, 0, 0) 100%);
    border: 2px solid rgba(255, 199, 66, 0.85);
    border-radius: 22px;
    text-shadow: 0 0 12px #ffbe2e, 0 0 30px #ff9500, 0 0 55px rgba(255, 149, 0, 0.6);
    box-shadow: 0 0 18px rgba(255, 183, 0, 0.35), inset 0 0 26px rgba(255, 183, 0, 0.12);
    cursor: pointer;
    text-decoration: none;
    animation: pulse 1.6s infinite alternate;
  }
  @keyframes pulse {
    from { opacity: 0.8; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1.03); }
  }
  /* 弹窗 */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 999;
  }
  .modal-content {
    background: #111;
    border: 1px solid #00bfff;
    border-radius: 12px;
    padding: 20px 25px;
    color: #fff;
    width: 300px;
    text-align: center;
    box-shadow: 0 0 20px #00bfff;
  }
  .modal-content input {
    width: 90%;
    padding: 8px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #00bfff;
    background: #000;
    color: #fff;
  }
  .modal-buttons button {
    margin: 6px;
    padding: 6px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  .save-btn { background: #00bfff; color: #000; }
  .delete-btn { background: #ff4444; color: #fff; }
  .cancel-btn { background: #333; color: #fff; }
</style>
</head>
<body>

<div id="adBanner">
  <a href="#" target="_blank">
    <img src="ad.jpg" alt="广告图" style="max-width:100%; max-height:100%; border-radius:12px;">
  </a>
</div>

<!-- ✅ 顺序：先进入全屏，再点下面的网址 -->
<a id="fullscreenLink">👉 点击这里进入全屏模式</a>

<p id="fullscreenTip" style="
  color:#ffcc55;
  text-shadow:0 0 8px rgba(255,183,0,0.55);
  font-size:1rem;
  text-align:center;
  margin-top:16px;
  line-height:1.6;
">
    💡 启用全屏后，只需点击「继续访问」，即可畅享沉浸式浏览。
</p>

<div class="url-box" style="margin-top:26px;">
  <input id="urlInput" type="text"
         placeholder="输入任意网址，再点上面的「进入全屏模式」，直接全屏打开">
  <button id="goButton">进入</button>
</div>

<div class="nav-links" id="navLinks"></div>

<p id="tipText" style="
  color:#00bfff;
  text-shadow:0 0 8px #00bfff, 0 0 16px #0099cc;
  font-size:1rem;
  text-align:center;
  margin-top:30px;
  line-height:1.6;
">
    💡 点击「+」号可添加常用网址，系统会自动保存，下次打开仍可使用。<br>
    💡 长按自己添加的网址，可修改名称或删除（默认网址不可删）。<br>
       点击[批量删除]，可快速删除自定义网址。<br>
</p>

<p id="safeNote" style="
  color: #ff3b3b;
  text-shadow: 0 0 8px #ff3b3b;
  font-size:1rem;
  text-align:center;
  margin-top:20px;
  opacity:0.9;
">
  ⚠️ 为确保行车安全，请仅在车辆驻车、且环境安全时使用本站。
</p>




<!-- 编辑弹窗 -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">添加网站</h3>
    <input id="modalName" type="text" placeholder="网站名称">
    <input id="modalUrl" type="text" placeholder="网址，如 https://www.example.com">
    <div class="modal-buttons">
      <button class="save-btn" id="saveBtn">保存</button>
      <button class="delete-btn" id="deleteBtn">删除</button>
      <button class="cancel-btn" id="cancelBtn">取消</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal" id="confirmModal" style="z-index:1000;">
  <div class="modal-content">
    <h3>确认删除</h3>
    <p id="confirmText" style="font-size:0.95rem; line-height:1.6; color:#ccc; margin:10px 0;"></p>
    <div class="modal-buttons">
      <button class="delete-btn" id="confirmYes">确定删除</button>
      <button class="cancel-btn" id="confirmNo">取消</button>
    </div>
  </div>
</div>

<script>

  function loadLinksFromURLParamAndSave(retry = 0) {
    const params = new URLSearchParams(window.location.search);
    const linksParam = params.get("links");
    if (!linksParam) {
      if (retry < 20) {
        // Tesla 会延迟赋值 search，延迟重试
        setTimeout(() => loadLinksFromURLParamAndSave(retry + 1), 250);
      }
      return;
    }
    try {
      const parsed = JSON.parse(decodeURIComponent(linksParam));
      if (Array.isArray(parsed)) {
        localStorage.setItem("customLinks", JSON.stringify(parsed));
        // 清理 URL 参数，避免重复
        params.delete("links");
        const newUrl = window.location.pathname + (params.toString() ? "?" + params.toString() : "");
        history.replaceState(null, "", newUrl);
        console.log("✅ Tesla 全屏同步成功", parsed);
      }
    } catch (e) {
      console.warn("解析 links 参数失败:", e);
    }
  }

// ⚡ 在脚本开头立即执行
loadLinksFromURLParamAndSave();


  // ✅ 默认站点分类结构
const defaultLinks = [
  // ✅ 第一行：我的站点（默认网址，不可删除）
  { name: "爱尔兰网址导航", url: "https://0086.ie" },
  { name: "华人地图", url: "https://map.0086.ie" },
  { name: "房源地图", url: "https://property.0086.ie" },
  { name: "学校地图", url: "https://school.0086.ie" },
  { name: "旅行地图", url: "https://travel.0086.ie" },
  { name: "活动地图", url: "https://event.0086.ie" },
  // { name: "0086353.xyz", url: "https://0086353.xyz" },
  // { name: "爱尔兰新闻", url: "https://news.eiresino.com" },

  // ✅ 第二行：趣味互动
  { break: true },
  { name: "流体光影", url: "https://paveldogreat.github.io/WebGL-Fluid-Simulation/" },
  { name: "水波互动", url: "https://madebyevan.com/webgl-water/" },
  { name: "沙子绘画", url: "https://thisissand.com" },
  { name: "环境音混音器", url: "https://asoftmurmur.com/" },
  { name: "全球风场", url: "https://www.windy.com/" }
];


  const navLinks = document.getElementById("navLinks");
  const urlInput = document.getElementById("urlInput");
  const goButton = document.getElementById("goButton");
  const fullscreenLink = document.getElementById("fullscreenLink");
  const modal = document.getElementById("modal");
  const modalTitle = document.getElementById("modalTitle");
  const modalName = document.getElementById("modalName");
  const modalUrl = document.getElementById("modalUrl");
  const saveBtn = document.getElementById("saveBtn");
  const deleteBtn = document.getElementById("deleteBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  let editingIndex = null;

  let batchDeleteMode = false; // ✅ 是否处于批量删除模式

  // ✅ 通用删除确认弹窗（车机上比浏览器原生 confirm 可靠）
  const confirmModal = document.getElementById("confirmModal");
  const confirmText = document.getElementById("confirmText");
  const confirmYes = document.getElementById("confirmYes");
  const confirmNo = document.getElementById("confirmNo");
  let confirmCallback = null;

  function confirmAction(message, onYes) {
    confirmText.textContent = message;
    confirmCallback = onYes;
    confirmModal.style.display = "flex";
  }

  confirmYes.onclick = () => {
    confirmModal.style.display = "none";
    const cb = confirmCallback;
    confirmCallback = null;
    if (typeof cb === "function") cb();
  };

  confirmNo.onclick = () => {
    confirmModal.style.display = "none";
    confirmCallback = null;
  };

function renderLinks() {
  const saved = JSON.parse(localStorage.getItem("customLinks") || "[]");
  const links = [...defaultLinks, ...saved];
  navLinks.innerHTML = "";

  links.forEach((l, i) => {
    // ✅ 只换行、不显示任何分隔符（车机屏幕小，省高度）
    if (l.break) {
      const brk = document.createElement("div");
      brk.className = "nav-break";
      navLinks.appendChild(brk);
      return;
    }

    // ✅ 分组标题（需要时才用，可写 { group: "分类名" }）
    if (l.group) {
      const groupEl = document.createElement("div");
      groupEl.className = "nav-group";
      groupEl.textContent = l.group;
      navLinks.appendChild(groupEl);
      return;
    }

    const a = document.createElement("a");
    a.textContent = l.name;
    a.href = l.url;
    a.target = "_blank";
    a.style.position = "relative";

    // ✅ 自定义网址（默认网址不显示 ❌）
    if (i >= defaultLinks.length) {
      // ✅ 长按 700ms 编辑（pointer 事件，触屏与鼠标通用；老车机回退 touch/mouse）
      let pressTimer = null;
      let longPressed = false;
      const hasPointer = "onpointerdown" in window;
      const downEvt = hasPointer ? "pointerdown" : ("ontouchstart" in window ? "touchstart" : "mousedown");
      const upEvts = hasPointer
        ? ["pointerup", "pointerleave", "pointercancel"]
        : ["mouseup", "mouseleave", "touchend", "touchcancel"];

      const startPress = () => {
        if (batchDeleteMode) return;   // ✅ 批量删除模式下不触发编辑
        longPressed = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          longPressed = true;
          openModal("edit", i - defaultLinks.length, l);
        }, 700);
      };
      const cancelPress = () => clearTimeout(pressTimer);

      a.addEventListener(downEvt, startPress);
      upEvts.forEach(ev => a.addEventListener(ev, cancelPress));
      // ✅ 长按触发后，松开那一下不要跳转
      a.addEventListener("click", (e) => {
        if (longPressed) {
          e.preventDefault();
          e.stopPropagation();
          longPressed = false;
        }
      });
      // ✅ 触屏长按不要弹出系统菜单/选中文字
      a.style.webkitUserSelect = "none";
      a.style.userSelect = "none";
      a.style.webkitTouchCallout = "none";
      a.addEventListener("contextmenu", (e) => e.preventDefault());

      // ✅ 批量删除模式下添加 ❌ 按钮
      if (batchDeleteMode) {
        const delBtn = document.createElement("span");
        delBtn.textContent = "✕";
        delBtn.style.cssText = `
          position: absolute;
          top: -8px;
          right: -8px;
          background: rgba(255,0,0,0.9);
          color: #fff;
          border-radius: 50%;
          width: 22px;
          height: 22px;
          font-size: 0.8rem;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          z-index: 10;
        `;
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();   // ✅ 阻止事件冒泡
          e.preventDefault();    // ✅ 阻止跳转链接
          confirmAction(`确定删除「${l.name}」吗？`, () => {
            saved.splice(i - defaultLinks.length, 1);
            localStorage.setItem("customLinks", JSON.stringify(saved));
            renderLinks();         // ✅ 重新渲染界面
          });
        });
        a.appendChild(delBtn);
      }
    }

    navLinks.appendChild(a);
  });

  // ✅ 让「+ / 批量删除」单独起一行，不和上面的分类混在一起
  const breakEl = document.createElement("div");
  breakEl.className = "nav-break";
  navLinks.appendChild(breakEl);

  // ✅ 添加 + 号按钮
  const addBtn = document.createElement("div");
  addBtn.textContent = "+";
  addBtn.className = "add-btn";
  addBtn.addEventListener("click", () => openModal("add"));
  navLinks.appendChild(addBtn);

  // ✅ 添加批量删除 / 保存按钮
  const deleteToggleBtn = document.createElement("div");
  deleteToggleBtn.textContent = batchDeleteMode ? "✅ 完成" : "🗑 批量删除";
  deleteToggleBtn.className = "add-btn";
  deleteToggleBtn.style.background = batchDeleteMode
    ? "rgba(0,255,128,0.25)"
    : "rgba(255,64,64,0.25)";
  deleteToggleBtn.style.borderColor = batchDeleteMode ? "#00ff99" : "#ff4444";
  deleteToggleBtn.style.color = batchDeleteMode ? "#00ff99" : "#ff6666";

  deleteToggleBtn.addEventListener("click", () => {
    batchDeleteMode = !batchDeleteMode; // ✅ 切换状态
    renderLinks();
  });

  navLinks.appendChild(deleteToggleBtn);
}


  function openModal(mode, index = null, data = {}) {
    modal.style.display = "flex";
    if (mode === "add") {
      modalTitle.textContent = "添加网站";
      modalName.value = "";
      modalUrl.value = "";
      deleteBtn.style.display = "none";
      editingIndex = null;
    } else {
      modalTitle.textContent = "编辑网站";
      modalName.value = data.name;
      modalUrl.value = data.url;
      deleteBtn.style.display = "inline-block";
      editingIndex = index;
    }
  }

  function closeModal() { modal.style.display = "none"; }

  saveBtn.onclick = () => {
  const name = modalName.value.trim();
  let url = modalUrl.value.trim();
  if (!name || !url) return alert("请输入名称和网址");
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;

  const saved = JSON.parse(localStorage.getItem("customLinks") || "[]");

  // ✅ 限制最多 30 个自定义网址
  if (editingIndex === null && saved.length >= 30) {
    alert("您已达到自定义网址的上限（30个），请删除部分再添加。");
    return;
  }

  if (editingIndex === null) saved.push({ name, url });
  else saved[editingIndex] = { name, url };

  localStorage.setItem("customLinks", JSON.stringify(saved));
  closeModal();
  renderLinks();
  };

  deleteBtn.onclick = () => {
    const name = modalName.value.trim() || "这个网址";
    confirmAction(`确定删除「${name}」吗？`, () => {
      const saved = JSON.parse(localStorage.getItem("customLinks") || "[]");
      saved.splice(editingIndex, 1);
      localStorage.setItem("customLinks", JSON.stringify(saved));
      closeModal();
      renderLinks();
    });
  };

  cancelBtn.onclick = closeModal;

  goButton.addEventListener("click", () => {
    let url = urlInput.value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    window.open(url, "_blank");
  });

  fullscreenLink.addEventListener("click", () => {
  // 1️⃣ 目标网址（用户输入或默认）
  let target = urlInput.value.trim() || "https://tesla.0086.ie/";
  if (!/^https?:\/\//i.test(target)) target = "https://" + target;

  // 2️⃣ 读取当前保存的自定义网址
  const saved = JSON.parse(localStorage.getItem("customLinks") || "[]");

  // 3️⃣ 编码保存的数据（避免特殊字符）
  const encodedLinks = encodeURIComponent(JSON.stringify(saved));

  // 4️⃣ 把数据作为 ?links= 参数附加到目标网址
  const sep = target.includes("?") ? "&" : "?";
  const targetWithLinks = target + sep + "links=" + encodedLinks;

  // 5️⃣ 用 Tesla 认可的跳转方式进入全屏
  const redirectUrl = "https://www.youtube.com/redirect?q=" + encodeURIComponent(targetWithLinks);
  window.location.href = redirectUrl;
  });


  renderLinks();
</script>


<!-- 🌊 霓虹波浪底部 -->
<div class="neon-ocean">
    <svg viewBox="0 0 1440 320" class="wave-layer">
        <path
        fill="rgba(0,191,255,0.3)"
        d="M0,160 C480,240 960,80 1440,160 L1440,320 L0,320 Z">
        <animate
          attributeName="d"
          dur="10s"
          begin="0s"
          repeatCount="indefinite"
          values="
            M0,160 C480,240 960,80 1440,160 L1440,320 L0,320 Z;
            M0,180 C480,120 960,200 1440,100 L1440,320 L0,320 Z;
            M0,140 C480,200 960,120 1440,180 L1440,320 L0,320 Z;
            M0,160 C480,240 960,80 1440,160 L1440,320 L0,320 Z
          " />
      </path>
      
      <path
        fill="rgba(0,191,255,0.5)"
        d="M0,160 C480,260 960,100 1440,200 L1440,320 L0,320 Z">
        <animate
          attributeName="d"
          dur="12s"       
          begin="-2s"     
          repeatCount="indefinite"
          values="
            M0,160 C480,260 960,100 1440,200 L1440,320 L0,320 Z;
            M0,180 C480,180 960,240 1440,140 L1440,320 L0,320 Z;
            M0,140 C480,220 960,160 1440,220 L1440,320 L0,320 Z;
            M0,160 C480,260 960,100 1440,200 L1440,320 L0,320 Z
          " />
      </path>
      
      <path
        fill="rgba(0,191,255,0.8)"
        d="M0,180 C480,300 960,160 1440,260 L1440,320 L0,320 Z">
        <animate
          attributeName="d"
          dur="9s"        
          begin="-4s"    
          repeatCount="indefinite"
          values="
            M0,180 C480,300 960,160 1440,260 L1440,320 L0,320 Z;
            M0,200 C480,200 960,260 1440,180 L1440,320 L0,320 Z;
            M0,160 C480,260 960,200 1440,240 L1440,320 L0,320 Z;
            M0,180 C480,300 960,160 1440,260 L1440,320 L0,320 Z
          " />
      </path>
    </svg>
  </div>
  
  <style>
  .neon-ocean {
    position: fixed;
    bottom: -50px;
    left: 0;
    width: 100%;
    height: 35vh; /* 高度自适应 */
    background: transparent;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  
  .wave-layer {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 10px #00bfff)
            drop-shadow(0 0 30px #0099cc)
            drop-shadow(0 0 50px #00ccff);
  }
  </style>
  <!-- 🌊 霓虹波浪结束 -->
  

</body>
</html>
